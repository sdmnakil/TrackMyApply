<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - TrackMyApply</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>TrackMyApply</h2>
        <p style="text-align:center; margin-top:-10px; color:#666;">Create a new account</p>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
            <div class="error" id="errorBox"></div>
        </form>
        <p class="link-text">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <div class="credit-tag">by sufi_16</div>

    <script src="script.js"></script>
</body>
</html>
